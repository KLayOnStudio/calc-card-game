name: Deploy backend to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

env:
  AZURE_FUNCTIONAPP_NAME: "funcmons-app"
  AZURE_RESOURCE_GROUP: "funcmons-rg"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build deployment package
        run: |
          cd backend
          zip -r ../funcmons-deploy.zip . \
            -x ".venv/*" -x "__pycache__/*" -x "*.pyc" \
            -x "local.settings.json*" -x "*.db"

      # This is the ONLY combination that actually works for a Python app on
      # a Flex Consumption plan, confirmed by hand before automating it here:
      # - `az functionapp deployment source config-zip`, NOT `az functionapp
      #   deploy` (the latter returns a 415 against this plan type) and NOT
      #   the Azure/functions-action or azure/webapps-deploy GitHub Actions
      #   (both hit a persistent, unresolved community bug — 404s from an
      #   incorrect Kudu zip-deploy path that Flex Consumption doesn't support).
      # - `--build-remote true` is required for Python specifically, per
      #   Microsoft's docs, so dependencies get installed server-side rather
      #   than needing to be pre-bundled into the zip.
      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --src funcmons-deploy.zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --build-remote true

      - name: Verify health endpoint
        run: |
          sleep 15
          HOSTNAME=$(az functionapp show --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostName -o tsv)
          curl -sf "https://$HOSTNAME/health"
