name: Deploy backend to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

env:
  AZURE_FUNCTIONAPP_NAME: "funcmons-app"
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      # Per Microsoft's docs, Azure/functions-action is meant to auto-detect
      # Flex Consumption and use OneDeploy (the only deployment technology
      # Flex Consumption supports). Pinned to the latest release explicitly
      # rather than the floating @v1 tag, since Flex-Consumption-aware
      # detection is relatively recent and @v1 may resolve to a stale
      # cached version.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1.5.7
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
