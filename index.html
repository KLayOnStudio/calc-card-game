<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KLayOnStudio Games</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --ink: #1c2333;
    --ink-soft: #5b6478;
    --accent: #3457d5;
    --border: #e1e5f0;
    --radius: 14px;
    font-family: "VT323", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 60px 16px;
    font-size: 1.25rem;
  }

  #app {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }

  .category-label {
    font-family: "Press Start 2P", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .game-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  .game-card:hover {
    border-color: var(--accent);
  }

  .game-title {
    font-family: "Press Start 2P", monospace;
    font-size: 1rem;
    margin-bottom: 8px;
    color: var(--accent);
  }

  .game-desc {
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div id="app">
  <h1>KLayOnStudio Games</h1>
  <p class="subtitle">Practice games for the classroom.</p>

  <p class="category-label">MATH</p>
  <a class="game-card" href="/math/funcmons/">
    <div class="game-title">FuncMons</div>
    <div class="game-desc">Gotta diff 'em all &mdash; a calculus derivative-matching card game.</div>
  </a>
</div>

</body>
</html>
